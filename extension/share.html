<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Share tabs with Claude</title>
  <link rel="icon" href="icons/icon16.png">
  <style>
    :root {
      --bg: #f9f9fb;
      --card: #ffffff;
      --text: #15141a;
      --muted: #5b5b66;
      --border: #e0e0e6;
      --accent: #0061e0;
      --accent-hover: #0250bb;
      --match: #fff4de;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1b22;
        --card: #2b2a33;
        --text: #fbfbfe;
        --muted: #bfbfc9;
        --border: #3a3944;
        --accent: #00ddff;
        --accent-hover: #80ebff;
        --match: #4a3b0e;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    header { padding: 18px 18px 10px; }
    h1 { font-size: 17px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 24px; height: 24px; }
    p { margin: 0 0 8px; color: var(--muted); }
    .reason {
      margin: 8px 0 0;
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .reason::before { content: "Claude says: "; color: var(--muted); }
    ul {
      list-style: none;
      margin: 0;
      padding: 0 18px;
      overflow-y: auto;
      flex: 1;
    }
    li label {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }
    li.match label { background: var(--match); }
    li img { width: 16px; height: 16px; flex-shrink: 0; }
    .tab-text { min-width: 0; }
    .tab-title, .tab-url { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-url { color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); padding: 8px 0; }
    footer {
      padding: 12px 18px 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid var(--border);
    }
    button {
      font: inherit; font-weight: 600;
      border-radius: 6px; padding: 7px 16px; cursor: pointer;
      border: 1px solid var(--border); background: var(--card); color: var(--text);
    }
    button.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
    @media (prefers-color-scheme: dark) { button.primary { color: #15141a; } }
    button.primary:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1><img src="icons/icon48.png" alt="">Claude wants to use some of your tabs</h1>
    <p>
      Pick the tabs Claude may use. Claude only sees the tabs you share, and has full control of them: it can
      read them, click, type, run scripts and close them, until you stop sharing (right-click the tab).
    </p>
    <div class="reason" id="reason" hidden></div>
  </header>
  <ul id="tabs"></ul>
  <footer>
    <button type="button" id="decline">Don't share</button>
    <button type="button" id="share" class="primary" disabled>Share selected tabs</button>
  </footer>
  <script src="share.js"></script>
</body>
</html>
